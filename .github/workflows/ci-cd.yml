name: Build, Push and Deploy

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/diplom-app

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.image_tag.outputs.tag }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set image tag
        id: image_tag
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image for pull request
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}

      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.image_tag.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
    name: Deploy application to VM
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure SSH deploy key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/github_actions_deploy
          chmod 600 ~/.ssh/github_actions_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Copy Compose manifest to VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          scp \
            -i ~/.ssh/github_actions_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            compose.yaml \
            "${VM_USER}@${VM_HOST}:/opt/devops-diploma-app/compose.yaml"

      - name: Deploy application with Docker Compose
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          ssh \
            -i ~/.ssh/github_actions_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${VM_USER}@${VM_HOST}" \
            "set -e;
             cd /opt/devops-diploma-app;
             printf 'IMAGE_NAME=%s\nIMAGE_TAG=%s\n' '${IMAGE_NAME}' '${IMAGE_TAG}' > .env;
             docker compose config;
             docker compose pull;
             docker compose up -d;
             docker compose ps;
             curl --fail --silent --show-error http://127.0.0.1 >/dev/null"
