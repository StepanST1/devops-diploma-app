  deploy:
    name: Deploy application to VM
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure SSH deploy key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/github_actions_deploy
          chmod 600 ~/.ssh/github_actions_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Copy Compose manifest to VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          ssh \
            -i ~/.ssh/github_actions_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${VM_USER}@${VM_HOST}" \
            "mkdir -p /opt/devops-diploma-app"

          scp \
            -i ~/.ssh/github_actions_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            compose.yaml \
            "${VM_USER}@${VM_HOST}:/opt/devops-diploma-app/compose.yaml"

      - name: Deploy application with Docker Compose
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          ssh \
            -i ~/.ssh/github_actions_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${VM_USER}@${VM_HOST}" \
            "set -e;
             cd /opt/devops-diploma-app;
             printf 'IMAGE_NAME=%s\nIMAGE_TAG=%s\n' '${IMAGE_NAME}' '${IMAGE_TAG}' > .env;
             docker compose config;
             docker compose pull;
             docker compose up -d;
             docker compose ps;
             curl --fail --silent --show-error http://127.0.0.1 >/dev/null"